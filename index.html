<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hotel Dashboard</title>
    <style>
        /* =========================================
           基本排版與黑夜模式 (Dark Mode) UI 設計
           ========================================= */
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #181825;
            padding: 15px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            box-sizing: border-box;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #f38ba8; /* 粉紅色標題 */
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-badge {
            background-color: #a6e3a1;
            color: #1e1e2e;
            font-size: 12px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 8px;
            vertical-align: middle;
        }

        .sync-time {
            font-size: 14px;
            color: #a6adc8;
        }

        /* 卡片網格排版 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background-color: #181825;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #cdd6f4;
            border-bottom: 1px solid #313244;
            padding-bottom: 10px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            font-size: 16px;
        }

        .data-label {
            color: #a6adc8;
        }

        .data-value {
            font-weight: bold;
        }

        /* 顏色狀態標籤 */
        .status-green { color: #a6e3a1; } /* 安全/開啟 */
        .status-red { color: #f38ba8; }   /* 危險/火警 */
        .status-yellow { color: #f9e2af; }/* 警告/鎖定 */
        .status-gray { color: #6c7086; }  /* 關閉 */

    </style>
</head>
<body>

    <div class="header">
        <h1>ThingSpeak Cloud Management <span class="live-badge">Live</span></h1>
        <div class="sync-time">Last Sync: <span id="last-sync-time">--:--:--</span></div>
    </div>

    <div class="dashboard-grid">
        
        <div class="card">
            <h2>☁️ Climate</h2>
            <div class="data-row">
                <span class="data-label">Temperature:</span>
                <span class="data-value status-green" id="disp-temp">-- °C</span>
            </div>
            <div class="data-row">
                <span class="data-label">Humidity:</span>
                <span class="data-value status-green" id="disp-hum">-- %</span>
            </div>
        </div>

        <div class="card">
            <h2>🚶‍♂️ Motion Security</h2>
            <div class="data-row">
                <span class="data-label">Intrusion Alert:</span>
                <span class="data-value status-green" id="disp-motion">Checking...</span>
            </div>
        </div>

        <div class="card">
            <h2>🔥 Fire Safety</h2>
            <div class="data-row">
                <span class="data-label">Flame Alert:</span>
                <span class="data-value status-green" id="disp-fire">Checking...</span>
            </div>
        </div>

        <div class="card">
            <h2>💨 Ventilation</h2>
            <div class="data-row">
                <span class="data-label">Fan Status:</span>
                <span class="data-value status-gray" id="disp-fan">OFF</span>
            </div>
        </div>

    </div>

    <script>
        // ⚠️ 已經填好你嘅 ThingSpeak Channel ID 同 Read API Key
        const channelID = "3388972";
        const readAPIKey = "G7G8JZJ74H05BI5V";
        const url = `https://api.thingspeak.com/channels/${channelID}/feeds/last.json?api_key=${readAPIKey}`;

        async function fetchThingSpeakData() {
            try {
                const response = await fetch(url);
                const data = await response.json();

                // 1. 更新同步時間
                const syncTime = new Date(data.created_at);
                document.getElementById('last-sync-time').innerText = syncTime.toLocaleTimeString('zh-HK');

                // 2. 溫濕度 (Field 1 & 2)
                if (data.field1) document.getElementById('disp-temp').innerText = parseFloat(data.field1).toFixed(1) + ' °C';
                if (data.field2) document.getElementById('disp-hum').innerText = parseFloat(data.field2).toFixed(1) + ' %';

                // ==========================================
                // 3. 🚨 終極修正：火警狀態 (Field 3)
                // ==========================================
                const fireEl = document.getElementById('disp-fire');
                if (data.field3 == "1") {
                    fireEl.innerText = "FIRE WARNING!";
                    fireEl.className = "data-value status-red"; // 變紅色
                } else {
                    fireEl.innerText = "Safe";
                    fireEl.className = "data-value status-green"; // 變綠色
                }

                // ==========================================
                // 4. 🚨 終極修正：防盜感應 (Field 4)
                // ==========================================
                const motionEl = document.getElementById('disp-motion');
                if (data.field4 == "1") {
                    motionEl.innerText = "Detected!";
                    motionEl.className = "data-value status-red"; // 變紅色
                } else {
                    motionEl.innerText = "Clear";
                    motionEl.className = "data-value status-green"; // 變綠色
                }

                // 5. 風扇狀態 (Field 7)
                const fanEl = document.getElementById('disp-fan');
                const fanSpeed = parseInt(data.field7);
                if (fanSpeed > 0) {
                    fanEl.innerText = `ON (${fanSpeed}%)`;
                    fanEl.className = "data-value status-green";
                } else {
                    fanEl.innerText = "OFF";
                    fanEl.className = "data-value status-gray";
                }

            } catch (error) {
                console.error("無法連線至 ThingSpeak:", error);
                document.getElementById('last-sync-time').innerText = "連線失敗";
            }
        }

        // 網頁一打開即刻執行一次
        fetchThingSpeakData();

        // 之後每 15 秒自動刷新一次 (配合 ThingSpeak 免費版限制)
        setInterval(fetchThingSpeakData, 15000);
    </script>
</body>
</html>
