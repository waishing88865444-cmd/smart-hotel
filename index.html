<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hotel Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            padding: 30px;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            width: 200px;
        }
        .value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
        }
        .unit { font-size: 1.2rem; }
        .status { color: #7f8c8d; font-size: 0.9rem; }
    </style>
</head>
<body>

    <h1>Smart Hotel Room Status</h1>
    <p class="status" id="update-time">Loading latest data...</p>

    <div class="container">
        <div class="card">
            <h3>Temperature</h3>
            <div class="value"><span id="temp">--</span><span class="unit">°C</span></div>
        </div>

        <div class="card">
            <h3>Humidity</h3>
            <div class="value"><span id="hum">--</span><span class="unit">%</span></div>
        </div>
    </div>

    <script>
        const channelID = "3388972";
        const readKey = "G7G8JZJ74H05BI5V";
        // Fetch the last 1 result from the channel feed
        const url = `https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readKey}&results=1`;

        async function fetchRoomData() {
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // Extract the latest data entry
                const latestFeed = data.feeds[0];
                
                if (latestFeed) {
                    // update fields (field1 = temp, field2 = hum)
                    document.getElementById('temp').innerText = parseFloat(latestFeed.field1).toFixed(1);
                    document.getElementById('hum').innerText = parseFloat(latestFeed.field2).toFixed(1);
                    
                    // Display the timestamp
                    const timestamp = new Date(latestFeed.created_at).toLocaleTimeString();
                    document.getElementById('update-time').innerText = `Last updated at: ${timestamp}`;
                }
            } catch (error) {
                console.error("Error fetching data from ThingSpeak:", error);
                document.getElementById('update-time').innerText = "Error loading data.";
            }
        }

        // Run on load, then auto-refresh every 30 seconds
        fetchRoomData();
        setInterval(fetchRoomData, 30000);
    </script>
</body>
</html>
